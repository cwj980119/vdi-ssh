<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VDI Screen</title><style>body{margin:0;background:#141414;color:#eee;font:14px system-ui,sans-serif}.bar{position:sticky;top:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#202020}button{padding:6px 12px}#status{color:#9ad}#screen{display:block;max-width:100vw;max-height:calc(100vh - 46px);margin:auto;outline:none;cursor:crosshair;user-select:none}</style><div class="bar"><b>VDI Screen</b><button id="control">원격 제어 켜기</button><span id="status">연결 중…</span></div><img id="screen" alt="VDI screen" tabindex="0"><script>
const token=location.hash.slice(1);const screen=document.querySelector('#screen'),status=document.querySelector('#status'),control=document.querySelector('#control');let enabled=false,busy=false;
if(!token){status.textContent='접속 토큰이 URL에 없습니다.'} else { history.replaceState(null,'',location.pathname); refresh(); }
const headers={'X-VDI-Token':token};
async function refresh(){if(!token||busy)return;busy=true;try{const r=await fetch('/frame',{headers,cache:'no-store'});if(!r.ok)throw Error(r.status);const b=await r.blob();screen.src=URL.createObjectURL(b);status.textContent=`화면 ${r.headers.get('X-VDI-Width')}×${r.headers.get('X-VDI-Height')} · ${enabled?'제어 중':'보기 전용'}`;}catch(e){status.textContent='연결 실패: '+e.message}finally{busy=false;setTimeout(refresh,250)}}
async function send(body){if(!enabled)return;try{await fetch('/input',{method:'POST',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)})}catch(e){status.textContent='입력 실패: '+e.message}}
function point(e){const r=screen.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}
control.onclick=()=>{enabled=!enabled;control.textContent=enabled?'원격 제어 끄기':'원격 제어 켜기';if(enabled)screen.focus()};
screen.oncontextmenu=e=>e.preventDefault();screen.onmousemove=e=>send({type:'mouse',action:'move',...point(e)});screen.onmousedown=e=>{e.preventDefault();screen.focus();send({type:'mouse',action:'down',button:e.button,...point(e)})};screen.onmouseup=e=>send({type:'mouse',action:'up',button:e.button,...point(e)});screen.onwheel=e=>{e.preventDefault();send({type:'mouse',action:'wheel',delta:Math.max(-1200,Math.min(1200,-e.deltaY)),...point(e)})};
screen.onkeydown=e=>{if(!enabled)return;if(e.key.length===1&&!e.ctrlKey&&!e.altKey&&!e.metaKey){e.preventDefault();send({type:'key',action:'unicode',key:e.key});return}e.preventDefault();send({type:'key',action:'down',code:e.code})};screen.onkeyup=e=>{if(enabled){e.preventDefault();send({type:'key',action:'up',code:e.code})}};
</script></html>
